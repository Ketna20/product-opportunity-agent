services:
  postgres:
    image: postgres:17-alpine
    container_name: product-opportunity-postgres
    environment:
      POSTGRES_DB: product_opportunity
      POSTGRES_USER: opportunity_user
      POSTGRES_PASSWORD: opportunity_password
    ports:
      - "5433:5432"
    volumes:
      - product_opportunity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U opportunity_user -d product_opportunity
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  product_opportunity_postgres_data: